plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

// Spike: skip optional mod compat + 1.21.11-broken ShaderInstance/VertexBuffer render trees
sourceSets.main.java {
    exclude '**/mixin/compatibility/**'
    exclude '**/mixin/sublevel_render/**'
    exclude '**/mixin/sky_light_shadow/**'
    exclude '**/mixin/plot/lighting/RenderChunkRegionMixin.java'
    exclude '**/mixin/camera/camera_rotation/CompassItemPropertyFunctionMixin.java'
    exclude '**/mixin/dynamic_directional_shading/AmbientOcclusionFaceMixin.java'
    exclude '**/mixin/config/GameRendererAccessor.java'
    exclude '**/mixin/debug_render/**'
    exclude '**/mixin/block_decal_render/LevelRendererMixin.java'
    exclude '**/sublevel/render/fancy/task/**'
    exclude '**/sublevel/render/fancy/BucketRenderBuffer.java'
    exclude '**/sublevel/render/fancy/FancySubLevelCommandBuilder.java'
    exclude '**/sublevel/render/fancy/FancySubLevelOcclusionData.java'
    exclude '**/sublevel/render/fancy/FancySubLevelRenderData.java'
    exclude '**/sublevel/render/fancy/FancySubLevelSectionCompiler.java'
    exclude '**/sublevel/render/fancy/SubLevelMeshBuilder.java'
    // keep FancySubLevelShaderProcessor stub
    exclude '**/sublevel/render/vanilla/VanillaChunkedSubLevelRenderData.java'
    exclude '**/sublevel/render/vanilla/VanillaSingleSubLevelRenderData.java'
    exclude '**/sublevel/render/dispatcher/VanillaSubLevelRenderDispatcher.java'
    exclude '**/sublevel/render/dispatcher/FancySubLevelRenderDispatcher.java'
    exclude '**/sublevel/render/dispatcher/ReachAroundSubLevelRenderDispatcher.java'
    exclude '**/sublevel/render/dispatcher/SubLevelTextureCache.java'
    exclude '**/sublevel/storage/debug/SubLevelContainerInspector.java'
    exclude '**/mixinhelpers/compatibility/**'
    // Keep compatibility/SableIrisCompat.java stub; exclude other compat helpers that need mod jars
    exclude '**/compatibility/SableComputerCraftCompat.java'
    exclude '**/compatibility/SableExposureCompat.java'
    exclude '**/compatibility/SableJadeCompat.java'
    exclude '**/compatibility/SableVistaCompat.java'
    exclude '**/mixin/dynamic_directional_shading/ModelBlockRendererMixin.java'
    exclude '**/render/water_occlusion/WaterOcclusionRenderRegion.java'
    exclude '**/render/dynamic_biome/**'
    exclude '**/render/dynamic_shade/SubLevelVertexConsumer.java'
    exclude '**/mixin/toast/**'
    exclude '**/mixin/udp/**'
    exclude '**/mixin/respawn_point/**'
    exclude '**/mixin/water_occlusion/**'
    exclude '**/mixinhelpers/sublevel_render/**'
    exclude '**/mixinhelpers/block_outline_render/**'

    exclude '**/sublevel/render/staging/**'
    exclude '**/debug/GizmoScreen.java'
    exclude '**/mixin/entity/entities_stick_sublevels/ClientPacketListenerMixin.java'
    exclude '**/mixin/entity/entities_stick_sublevels/EntityRenderDispatcherMixin.java'
    exclude '**/mixin/entity/entities_in_blocks/EntityMixin.java'
    exclude '**/mixin/entity/entity_rendering/**'
    exclude '**/mixin/entity/entity_rotations_and_riding/EntityRendererMixin.java'
    exclude '**/mixin/entity/entity_pathfinding/**'
    exclude '**/mixin/entity/entity_rotations_and_riding/EntityMixin.java'
    exclude '**/mixin/explosion/ExplosionMixin.java'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

// Declare capabilities on the outgoing configurations.
// Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
['apiElements', 'runtimeElements', 'sourcesElements'/*, 'javadocElements'*/].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

dependencies {
    compileOnly "net.fabricmc:sponge-mixin:0.15.2+mixin.0.8.7"

    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly "io.github.llamalad7:mixinextras-common:0.5.3"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.3"

    implementation "org.apache.maven:maven-artifact:3.8.5"

    api "dev.ryanhcode.sable-companion:sable-companion-common-$dep_minecraft_version:$sable_companion_version"

    implementation("foundry.veil:veil-common-${project.dep_minecraft_version}:${project.veil_version}") {
        exclude group: "maven.modrinth"
    }
    // imguimc optional — skipped for 1.21.11 spike (maven host timeouts)

    compileOnly("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}") {
        transitive = false
    }

    //source: https://github.com/Fuzss/forgeconfigapiport
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-common-neoforgeapi:${forgeconfigapiport_version}"
}
