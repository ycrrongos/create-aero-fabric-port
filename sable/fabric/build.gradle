import net.fabricmc.loom.task.RemapJarTask

plugins {
    id 'me.modmuss50.mod-publish-plugin'
    id 'net.fabricmc.fabric-loom-remap'
    id 'multiloader-loader'
}



evaluationDependsOn(":sable_rapier")
tasks.register("remapRapierJar", RemapJarTask) {
    def rapier = project(":sable_rapier")
    def jar = rapier.tasks.named("jar", Jar)
    dependsOn(jar)

    inputFile = jar.flatMap { it.archiveFile }
    archiveFileName = jar.flatMap { it.archiveFileName }
}

remapJar {
    dependsOn "remapRapierJar"
    nestedJars.from(remapRapierJar.archiveFile)
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation fabricApi.module("fabric-command-api-v2", project.fabric_version)
    modImplementation fabricApi.module("fabric-lifecycle-events-v1", project.fabric_version)
    modImplementation fabricApi.module("fabric-resource-loader-v0", project.fabric_version)
    modImplementation fabricApi.module("fabric-convention-tags-v2", project.fabric_version)

    include(implementation("org.apache.maven:maven-artifact:3.8.5"))

    include(modApi("dev.ryanhcode.sable-companion:sable-companion-fabric-$dep_minecraft_version:$sable_companion_version"))

    // Optional compat — skip until 1.21.11 artifacts exist
    // modCompileOnly "net.caffeinemc:sodium-fabric:${rootProject.sodium_version}"
    // modCompileOnly "maven.modrinth:distanthorizons:${rootProject.distant_horizons_version}"
    // modCompileOnly "maven.modrinth:sodium-extras:fabric-${minecraft_version}-$sodiumextras_version"
    // modCompileOnly "maven.modrinth:shoulder-surfing-reloaded:${minecraft_version}-${project.shouldersurfing_version}+fabric"

    include(modApi("foundry.veil:veil-fabric-${project.dep_minecraft_version}:${project.veil_version}"))
    // imguimc is optional debug UI; skip during 1.21.11 spike (raw.githubusercontent timeouts)

    runtimeOnly(project(path: ":sable_rapier", configuration: "runtimeElements"))

    include(modApi("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}")) //source: https://github.com/Fuzss/forgeconfigapiport-fabric
}

loom {
    def aw = project(":common").file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        def client = client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("runs/client")
        }
        def server = server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("runs/server")
        }

        clientMixinExport {
            inherit(client)
            setConfigName(configName + " | Mixin Export")
            vmArg("-Dmixin.debug.export=true")
            runDir("runs/client")
        }
        serverMixinExport {
            inherit(server)
            setConfigName(configName + " | Mixin Export")
            vmArg("-Dmixin.debug.export=true")
            runDir("runs/server")
        }
    }
}

repositories {
    mavenLocal()
    maven { url = "https://maven.quiltmc.org/repository/release" }
}

